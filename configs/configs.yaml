defaults:
  - env: dmc_vision
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 0
deterministic_run: False
device: 'cuda:0'

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 3e6
  device: ${device}
  storage_device: ${device}

trainer:
  steps: ${env.steps}
  pretrain: 0
  eval_every: 2e5
  eval_episode_num: ${env.eval_episode_num}
  # A zero cap preserves the existing evaluator for other environments.
  eval_max_steps: ${oc.select:env.eval_max_steps,0}
  survival_eval: ${oc.select:env.survival_eval,false}
  eval_seed: ${seed}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  train_ratio: ${env.train_ratio}
  video_pred_log: False
  params_hist_log: False
  update_log_every: 5e3
  # Set to a positive number of environment steps to retain periodic snapshots;
  # 0 disables periodic checkpointing (the final latest.pt is always saved).
  checkpoint_every: 2e5
  action_repeat: ${env.action_repeat}
